version: '3.8'

services:
  backend:
    build: ./trafficvision/backend
    environment:
      - TV_MODEL_PATH=yolov8s.pt
      - TV_IMGSZ=640
      - TV_FRAME_STRIDE=2
      - TV_CONF_MOTORCYCLE=0.15
      - TV_CONF_BUS=0.20
      - TV_CONF_TRUCK=0.20
      - TV_DATABASE_URL=sqlite:////data/trafficvision.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build: ./trafficvision/frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped