services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      TV_INPUT_DIR: /data/input
      TV_OUTPUT_DIR: /data/output
      TV_DATABASE_URL: sqlite:////data/trafficvision.db

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      API_BASE: http://backend:8000
    depends_on:
      - backend
